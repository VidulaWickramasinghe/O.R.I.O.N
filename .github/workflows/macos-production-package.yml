name: macOS production package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-notarized-package:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Require production signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for value in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!value}" || { echo "Missing required secret: $value"; exit 1; }
          done
      - uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: frontend
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Export build Python
        run: echo "ORION_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Build signed and notarized app and DMG
        run: npm run desktop:build -- --config src-tauri/tauri.macos.conf.json --bundles app,dmg
        working-directory: frontend
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Enforce signature, notarization, clean package, and upgrade evidence
        run: >-
          python scripts/verify_desktop_bundle.py
          --platform macos
          --bundle-root frontend/src-tauri/target/release/bundle
          --output desktop-evidence/macos-production.json
          --require-production-signature
          --require-notarization
      - uses: actions/upload-artifact@v4
        with:
          name: orion-macos-production
          path: |
            frontend/src-tauri/target/release/bundle/macos
            frontend/src-tauri/target/release/bundle/dmg
            desktop-evidence/macos-production.json
          if-no-files-found: error
