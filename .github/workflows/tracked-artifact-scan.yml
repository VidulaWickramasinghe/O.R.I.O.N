name: Tracked artifact and secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject tracked runtime/private artifacts and obvious secrets
        run: python scripts/check_tracked_artifacts.py
