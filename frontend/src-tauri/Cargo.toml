[package]
name = "orion-aurora-os"
version = "6.7.0"
description = "O.R.I.O.N. Aurora OS desktop shell"
authors = ["O.R.I.O.N."]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
